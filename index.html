<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cine RD</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
        }

        .welcome {
            position: fixed;
            inset: 0;
            background: #080808;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 90%;
            max-width: 400px;
            background: #181818;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }

        .logo {
            color: #e50914;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #aaa;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f6121d;
        }

    </style>
</head>

<body>

    <div class="welcome" id="welcome">

        <div class="box">

            <div class="logo">
                CINE RD
            </div>

            <h1>
                ¡Bienvenido! 🇩🇴
            </h1>

            <p>
                ¿Cómo quieres que te llamemos?
            </p>

            <input
                id="name"
                type="text"
                placeholder="Escribe tu nombre"
            >

            <button onclick="entrar()">
                ENTRAR
            </button>

        </div>

    </div>

    <script>
function entrar() {

    const nombre =
        document.getElementById("name").value.trim();

    if (nombre === "") {
        return;
    }

    document.getElementById("welcome").style.display = "none";

}


/* Permitir entrar pulsando ENTER */

document.getElementById("name").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            entrar();

        }

    }
);
        
    </script>

</body>
</html>
