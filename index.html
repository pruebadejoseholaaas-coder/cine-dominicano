<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Películas Dominicanas Gratis</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        .pantalla {
            display: none;
            padding: 20px;
        }

        .visible {
            display: block;
        }

        h1, h2 {
            text-align: center;
        }

        .inicio-contenido, .admin-contenido {
            max-width: 400px;
            margin: 80px auto;
            text-align: center;
            background: #222;
            padding: 20px;
            border-radius: 10px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #e50914;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #f6121d;
        }

        .peliculas-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .pelicula-card {
            background: #222;
            width: 320px;
            padding: 10px;
            border-radius: 10px;
        }

        iframe {
            width: 100%;
            height: 180px;
            border-radius: 10px;
        }

        .comentarios {
            margin-top: 10px;
        }

        .comentarios-lista {
            max-height: 120px;
            overflow-y: auto;
            background: #111;
            padding: 5px;
            border-radius: 5px;
            font-size: 14px;
        }

        .comentario-item {
            border-bottom: 1px solid #333;
            padding: 4px 0;
        }

        .usuario-info {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #ccc;
        }

        .admin-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #444;
        }
    </style>
</head>
<body>

<!-- PANTALLA DE INICIO -->
<div id="pantallaInicio" class="pantalla visible">
    <div class="inicio-contenido">
        <h1>Películas Dominicanas Gratis</h1>
        <p>Escribe tu nombre para entrar.</p>
        <input type="text" id="nombreUsuario" placeholder="Tu nombre">
        <button id="btnEntrar">Entrar</button>
    </div>
</div>

<!-- PANTALLA PRINCIPAL -->
<div id="pantallaApp" class="pantalla">
    <h2>Catálogo de Películas Dominicanas</h2>
    <div class="usuario-info">
        Usuario: <span id="nombreMostrado"></span>
    </div>
    <div class="peliculas-container" id="peliculasContainer"></div>
</div>

<!-- BOTÓN PARA ADMIN -->
<button class="admin-btn" id="btnAdmin">Admin</button>

<!-- PANTALLA ADMIN -->
<div id="pantallaAdmin" class="pantalla">
    <div class="admin-contenido">
        <h2>Panel de Administración</h2>

        <div id="adminLogin">
            <p>Contraseña de administrador:</p>
            <input type="password" id="adminPass" placeholder="Contraseña">
            <button id="btnLoginAdmin">Entrar</button>
        </div>

        <div id="adminPanel" style="display:none;">
            <h3>Agregar nueva película</h3>
            <input type="text" id="tituloPeli" placeholder="Título">
            <input type="text" id="descPeli" placeholder="Descripción">
            <input type="text" id="youtubePeli" placeholder="ID de YouTube">
            <button id="btnAgregarPeli">Agregar</button>
        </div>
    </div>
</div>

<script>
    // CONTRASEÑA DEL ADMIN
    const ADMIN_PASSWORD = "dominicana123"; // cámbiala cuando quieras

    // CARGAR PELÍCULAS
    let peliculas = JSON.parse(localStorage.getItem("peliculas_db")) || [
        {
            id: 1,
            titulo: "Película Dominicana 1",
            descripcion: "Descripción breve.",
            youtubeId: "VIDEO_ID_1"
        }
    ];

    function guardarPeliculas() {
        localStorage.setItem("peliculas_db", JSON.stringify(peliculas));
    }

    // COMENTARIOS
    let comentarios = JSON.parse(localStorage.getItem("comentarios_db")) || {};

    function guardarComentarios() {
        localStorage.setItem("comentarios_db", JSON.stringify(comentarios));
    }

    // ELEMENTOS
    const pantallaInicio = document.getElementById("pantallaInicio");
    const pantallaApp = document.getElementById("pantallaApp");
    const pantallaAdmin = document.getElementById("pantallaAdmin");

    const nombreUsuarioInput = document.getElementById("nombreUsuario");
    const nombreMostrado = document.getElementById("nombreMostrado");
    const peliculasContainer = document.getElementById("peliculasContainer");

    const btnEntrar = document.getElementById("btnEntrar");
    const btnAdmin = document.getElementById("btnAdmin");
    const btnLoginAdmin = document.getElementById("btnLoginAdmin");
    const btnAgregarPeli = document.getElementById("btnAgregarPeli");

    let usuarioActual = "";

    // ENTRAR A LA WEB
    btnEntrar.addEventListener("click", () => {
        const nombre = nombreUsuarioInput.value.trim();
        if (!nombre) return alert("Escribe tu nombre.");
        usuarioActual = nombre;
        nombreMostrado.textContent = usuarioActual;

        pantallaInicio.classList.remove("visible");
        pantallaApp.classList.add("visible");

        renderPeliculas();
    });

    // ABRIR PANEL ADMIN
    btnAdmin.addEventListener("click", () => {
        pantallaInicio.classList.remove("visible");
        pantallaApp.classList.remove("visible");
        pantallaAdmin.classList.add("visible");
    });

    // LOGIN ADMIN
    btnLoginAdmin.addEventListener("click", () => {
        const pass = document.getElementById("adminPass").value;
        if (pass === ADMIN_PASSWORD) {
            document.getElementById("adminLogin").style.display = "none";
            document.getElementById("adminPanel").style.display = "block";
        } else {
            alert("Contraseña incorrecta.");
        }
    });

    // AGREGAR PELÍCULA
    btnAgregarPeli.addEventListener("click", () => {
        const titulo = document.getElementById("tituloPeli").value.trim();
        const desc = document.getElementById("descPeli").value.trim();
        const youtube = document.getElementById("youtubePeli").value.trim();

        if (!titulo || !desc || !youtube) return alert("Completa todos los campos.");

        peliculas.push({
            id: Date.now(),
            titulo,
            descripcion: desc,
            youtubeId: youtube
        });

        guardarPeliculas();
        alert("Película agregada.");

        document.getElementById("tituloPeli").value = "";
        document.getElementById("descPeli").value = "";
        document.getElementById("youtubePeli").value = "";
    });

    // RENDER PELÍCULAS
    function renderPeliculas() {
        peliculasContainer.innerHTML = "";

        peliculas.forEach(p => {
            const card = document.createElement("div");
            card.className = "pelicula-card";

            card.innerHTML = `
                <h3>${p.titulo}</h3>
                <p>${p.descripcion}</p>
                <iframe src="https://www.youtube.com/embed/${p.youtubeId}" allowfullscreen></iframe>
                <div class="comentarios">
                    <h4>Comentarios</h4>
                    <div class="comentarios-lista" id="c_${p.id}"></div>
                    <input type="text" id="i_${p.id}" placeholder="Escribe un comentario...">
                    <button onclick="comentar(${p.id})">Comentar</button>
                </div>
            `;

            peliculasContainer.appendChild(card);
            mostrarComentarios(p.id);
        });
    }

    // COMENTAR
    function comentar(id) {
        const input = document.getElementById("i_" + id);
        const texto = input.value.trim();
        if (!texto) return;

        if (!comentarios[id]) comentarios[id] = [];

        comentarios[id].push({
            usuario: usuarioActual,
            texto,
            fecha: new Date().toLocaleString()
        });

        guardarComentarios();
        input.value = "";
        mostrarComentarios(id);
    }

    // MOSTRAR COMENTARIOS
    function mostrarComentarios(id) {
        const cont = document.getElementById("c_" + id);
        cont.innerHTML = "";

        (comentarios[id] || []).forEach(c => {
            const div = document.createElement("div");
            div.className = "comentario-item";
            div.textContent = `${c.usuario}: ${c.texto} (${c.fecha})`;
            cont.appendChild(div);
        });
    }
</script>

</body>
</html>
