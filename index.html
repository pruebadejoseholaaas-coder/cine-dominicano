<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cine Dominicano</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --rojo-rd: #E50914;
            --azul-rd: #002D62;
            --blanco-rd: #FFFFFF;
            --fondo-oscuro: #050814;
            --gris-claro: #CCCCCC;
            --gris: #888888;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background:
                radial-gradient(circle at top, #0b1630 0, #050814 45%, #000000 100%);
            color: var(--blanco-rd);
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font-family: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(5, 8, 20, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 15px;
        }

        /* LOGO */

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        .logo-flag {
            width: 26px;
            height: 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            overflow: hidden;
            border-radius: 2px;
        }

        .flag-blue {
            background: var(--azul-rd);
        }

        .flag-red {
            background: var(--rojo-rd);
        }

        .flag-white {
            background: var(--blanco-rd);
        }

        .logo-text-main {
            font-size: 18px;
        }

        .logo-text-sub {
            font-size: 11px;
            color: var(--gris-claro);
        }

        /* NAV */

        nav {
            display: flex;
            gap: 8px;
            font-size: 13px;
        }

        nav span {
            cursor: pointer;
            padding: 5px 9px;
            border-radius: 999px;
            transition: 0.2s;
        }

        nav span:hover {
            background: rgba(255,255,255,0.08);
        }

        /* BUSCADOR */

        .search-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.06);
            padding: 5px 9px;
            border-radius: 999px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--blanco-rd);
            font-size: 12px;
            width: 140px;
        }

        .search-box input::placeholder {
            color: #999;
        }

        /* =========================
           PANTALLAS
        ========================= */

        .pantalla {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 15px 40px;
        }

        /*
           IMPORTANTE:
           .visible controla qué pantalla aparece.
        */

        .pantalla.visible {
            display: block;
        }

        /* =========================
           PANTALLA INICIO
        ========================= */

        #pantallaInicio {
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
        }

        #pantallaInicio.visible {
            display: flex;
        }

        .inicio-form {
            background:
                linear-gradient(
                    135deg,
                    rgba(0,45,98,0.95),
                    rgba(229,9,20,0.95)
                );

            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        .inicio-form h2 {
            font-size: 20px;
            margin: 0 0 6px;
        }

        .inicio-form p {
            font-size: 12px;
            color: #f5f5f5;
            margin: 0 0 15px;
        }

        .inicio-form input {
            width: 100%;
            padding: 11px 15px;
            border-radius: 999px;
            border: none;
            outline: none;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .inicio-form input:focus {
            box-shadow: 0 0 0 3px rgba(255,255,255,0.25);
        }

        /* =========================
           BOTONES
        ========================= */

        .btn {
            border: none;
            cursor: pointer;
            border-radius: 999px;
            padding: 9px 16px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--rojo-rd);
            color: var(--blanco-rd);
            width: 100%;
        }

        .btn-primary:hover {
            background: #ff1b24;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }

        /* =========================
           PANTALLA APP
        ========================= */

        #pantallaApp {
            flex-direction: column;
            align-items: center;
        }

        #pantallaApp.visible {
            display: flex;
        }

        .usuario-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
        }

        .usuario-info {
            font-size: 12px;
            color: var(--gris-claro);
        }

        .usuario-info strong {
            color: white;
        }

        .seccion-titulo {
            font-size: 20px;
            margin-bottom: 8px;
            text-align: center;
        }

        .seccion-subtitulo {
            font-size: 12px;
            color: var(--gris-claro);
            text-align: center;
            margin-bottom: 15px;
        }

        /* =========================
           CATÁLOGO
        ========================= */

        .peliculas-container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 10px;
        }

        .pelicula-card {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: 0.2s;
        }

        .pelicula-card:hover {
            transform: translateY(-3px);
            border-color: rgba(229,9,20,0.5);
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }

        .pelicula-poster {
            width: 100%;
            height: 140px;
            border-radius: 10px;
            background: linear-gradient(135deg, #1b2a4a, #e50914);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .pelicula-titulo {
            font-size: 15px;
            font-weight: 700;
        }

        .pelicula-meta {
            font-size: 11px;
            color: #aaa;
        }

        .pelicula-desc {
            font-size: 11px;
            color: #CCCCCC;
            line-height: 1.5;
        }

        iframe {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            border: none;
            background: #000;
        }

        .sin-resultados {
            width: 100%;
            text-align: center;
            color: #aaa;
            padding: 30px 10px;
        }

        /* =========================
           ADMIN
        ========================= */

        .admin-btn {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: rgba(0,45,98,0.95);
            color: var(--blanco-rd);
            border-radius: 999px;
            border: none;
            padding: 9px 14px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            z-index: 20;
        }

        .admin-btn:hover {
            background: #003d83;
        }

        #pantallaAdmin.visible {
            display: block;
        }

        .admin-contenido {
            max-width: 420px;
            margin: 40px auto;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .admin-contenido h2 {
            margin-top: 0;
        }

        .admin-contenido input {
            width: 100%;
            padding: 10px;
            border-radius: 999px;
            border: none;
            outline: none;
            font-size: 12px;
            margin-bottom: 8px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .header-inner {
                flex-wrap: wrap;
            }

            .logo {
                width: 100%;
            }

            nav {
                order: 3;
                width: 100%;
                justify-content: center;
            }

            .search-box {
                flex: 1;
            }

            .search-box input {
                width: 100%;
            }

            .peliculas-container {
                grid-template-columns: repeat(
                    auto-fill,
                    minmax(180px, 1fr)
                );
            }
        }

        @media (max-width: 500px) {

            .header-inner {
                padding: 8px 10px;
            }

            .logo-text-main {
                font-size: 16px;
            }

            .logo-text-sub {
                font-size: 9px;
            }

            nav {
                font-size: 11px;
                gap: 2px;
            }

            nav span {
                padding: 5px 6px;
            }

            .peliculas-container {
                grid-template-columns: 1fr;
            }

            .inicio-form {
                padding: 20px;
            }

            .usuario-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-inner">

        <div class="logo" id="logoInicio">

            <div class="logo-flag">
                <div class="flag-blue"></div>
                <div class="flag-red"></div>
                <div class="flag-white"></div>
                <div class="flag-blue"></div>
            </div>

            <div>
                <div class="logo-text-main">
                    Cine Dominicano
                </div>

                <div class="logo-text-sub">
                    Cine de República Dominicana
                </div>
            </div>

        </div>


        <nav>

            <span id="navInicio">
                Inicio
            </span>

            <span id="navPeliculas">
                Películas
            </span>

            <span id="navSorprendeme">
                🎲 Sorpréndeme
            </span>

        </nav>


        <div class="search-box">

            <span>🔎</span>

            <input
                type="text"
                id="buscadorGlobal"
                placeholder="Buscar..."
            >

        </div>

    </div>

</header>


<!-- =========================
     PANTALLA INICIO
========================= -->

<div id="pantallaInicio" class="pantalla visible">

    <div class="inicio-form">

        <h2>
            🇩🇴 Bienvenido a Cine Dominicano
        </h2>

        <p>
            Escribe tu nombre para entrar y ver el catálogo.
        </p>

        <input
            type="text"
            id="nombreUsuario"
            placeholder="Tu nombre"
            autocomplete="name"
            maxlength="30"
        >

        <button
            class="btn btn-primary"
            id="btnEntrar"
        >
            ▶ Entrar
        </button>

    </div>

</div>


<!-- =========================
     PANTALLA APP
========================= -->

<div id="pantallaApp" class="pantalla">

    <div class="usuario-bar">

        <div class="usuario-info">

            👤 Usuario:
            <strong id="nombreMostrado"></strong>

        </div>

        <button
            class="btn btn-secondary"
            id="btnSalir"
        >
            Salir
        </button>

    </div>


    <div class="seccion-titulo">
        🎬 Catálogo de Películas Dominicanas
    </div>

    <div class="seccion-subtitulo">
        Descubre películas de República Dominicana.
    </div>


    <div
        class="peliculas-container"
        id="peliculasContainer"
    ></div>

</div>


<!-- =========================
     PANTALLA ADMIN
========================= -->

<div id="pantallaAdmin" class="pantalla">

    <div class="admin-contenido">

        <h2>
            ⚙ Panel de Administración
        </h2>


        <!-- LOGIN ADMIN -->

        <div id="adminLogin">

            <input
                type="password"
                id="adminPass"
                placeholder="Contraseña"
            >

            <button
                class="btn btn-primary"
                id="btnLoginAdmin"
            >
                Entrar como administrador
            </button>

        </div>


        <!-- PANEL ADMIN -->

        <div
            id="adminPanel"
            style="display:none;"
        >

            <input
                type="text"
                id="tituloPeli"
                placeholder="Título de la película"
            >

            <input
                type="text"
                id="descPeli"
                placeholder="Descripción"
            >

            <input
                type="text"
                id="metaPeli"
                placeholder="Año · Género · País"
            >

            <input
                type="text"
                id="youtubePeli"
                placeholder="ID de YouTube"
            >

            <button
                class="btn btn-primary"
                id="btnAgregarPeli"
            >
                ➕ Agregar película
            </button>

        </div>

    </div>

</div>


<!-- =========================
     BOTÓN ADMIN
========================= -->

<button
    class="admin-btn"
    id="btnAdmin"
>
    ⚙ Admin
</button>


<script>

    /* =========================================
       CONFIGURACIÓN
    ========================================= */

    const ADMIN_PASSWORD = "dominicana123";


    /* =========================================
       BASE DE DATOS DE PELÍCULAS
    ========================================= */

    let peliculas = JSON.parse(
        localStorage.getItem("peliculas_db")
    ) || [

        {
            id: 1,
            titulo: "Qué León",
            descripcion: "Comedia romántica dominicana.",
            meta: "2018 · Comedia · República Dominicana",

            /*
               IMPORTANTE:
               Reemplaza VIDEO_ID_1 por un ID real
               de un video de YouTube que tengas
               autorización para insertar.
            */

            youtubeId: "VIDEO_ID_1"
        }

    ];


    /* =========================================
       COMENTARIOS
    ========================================= */

    let comentarios = JSON.parse(
        localStorage.getItem("comentarios_db")
    ) || {};


    /* =========================================
       ELEMENTOS HTML
    ========================================= */

    const pantallaInicio =
        document.getElementById("pantallaInicio");

    const pantallaApp =
        document.getElementById("pantallaApp");

    const pantallaAdmin =
        document.getElementById("pantallaAdmin");


    const nombreUsuarioInput =
        document.getElementById("nombreUsuario");

    const nombreMostrado =
        document.getElementById("nombreMostrado");

    const peliculasContainer =
        document.getElementById("peliculasContainer");


    const btnEntrar =
        document.getElementById("btnEntrar");

    const btnSalir =
        document.getElementById("btnSalir");

    const btnAdmin =
        document.getElementById("btnAdmin");

    const btnLoginAdmin =
        document.getElementById("btnLoginAdmin");

    const btnAgregarPeli =
        document.getElementById("btnAgregarPeli");


    const navInicio =
        document.getElementById("navInicio");

    const navPeliculas =
        document.getElementById("navPeliculas");

    const navSorprendeme =
        document.getElementById("navSorprendeme");


    const buscadorGlobal =
        document.getElementById("buscadorGlobal");


    const logoInicio =
        document.getElementById("logoInicio");


    /* =========================================
       USUARIO ACTUAL

       Ahora se guarda en localStorage.
       Esto permite que el usuario siga dentro
       aunque recargue la página.
    ========================================= */

    let usuarioActual =
        localStorage.getItem("usuarioActual") || "";


    /* =========================================
       MOSTRAR PANTALLA
    ========================================= */

    function mostrarPantalla(id) {

        pantallaInicio.classList.remove("visible");

        pantallaApp.classList.remove("visible");

        pantallaAdmin.classList.remove("visible");


        /*
           Si no hay usuario y trata de entrar
           a una pantalla protegida, lo enviamos
           al inicio.
        */

        if (!usuarioActual && id !== "pantallaInicio") {

            pantallaInicio.classList.add("visible");

            return;
        }


        const pantalla =
            document.getElementById(id);


        if (pantalla) {

            pantalla.classList.add("visible");

        }

    }


    /* =========================================
       ACTUALIZAR MENÚ
    ========================================= */

    function actualizarMenu() {

        const protegido = [
            navPeliculas,
            navSorprendeme
        ];


        protegido.forEach(item => {

            item.style.opacity =
                usuarioActual ? "1" : "0.3";

            item.style.pointerEvents =
                usuarioActual ? "auto" : "none";

        });

    }


    /* =========================================
       ENTRAR
    ========================================= */

    btnEntrar.addEventListener(
        "click",
        entrar
    );


    /*
       También permite pulsar ENTER
       después de escribir el nombre.
    */

    nombreUsuarioInput.addEventListener(
        "keydown",
        function(e) {

            if (e.key === "Enter") {

                entrar();

            }

        }
    );


    function entrar() {

        const nombre =
            nombreUsuarioInput.value.trim();


        /*
           No permitimos entrar sin nombre.
        */

        if (!nombre) {

            alert(
                "Escribe tu nombre para entrar."
            );

            nombreUsuarioInput.focus();

            return;
        }


        /*
           Guardamos el usuario.
        */

        usuarioActual = nombre;


        /*
           Guardamos también en localStorage
           para recordarlo.
        */

        localStorage.setItem(
            "usuarioActual",
            usuarioActual
        );


        /*
           Mostramos el nombre.
        */

        nombreMostrado.textContent =
            usuarioActual;


        /*
           Actualizamos menú.
        */

        actualizarMenu();


        /*
           Entramos al catálogo.
        */

        mostrarPantalla(
            "pantallaApp"
        );


        /*
           Mostramos las películas.
        */

        renderPeliculas();

    }


    /* =========================================
       SALIR
    ========================================= */

    btnSalir.addEventListener(
        "click",
        salir
    );


    function salir() {

        usuarioActual = "";


        localStorage.removeItem(
            "usuarioActual"
        );


        nombreUsuarioInput.value = "";

        nombreMostrado.textContent = "";


        actualizarMenu();


        mostrarPantalla(
            "pantallaInicio"
        );

    }


    /* =========================================
       NAVEGACIÓN
    ========================================= */

    navInicio.addEventListener(
        "click",
        function() {

            mostrarPantalla(
                "pantallaInicio"
            );

        }
    );


    navPeliculas.addEventListener(
        "click",
        function() {

            if (!usuarioActual) return;

            mostrarPantalla(
                "pantallaApp"
            );

            renderPeliculas();

        }
    );


    /* =========================================
       SORPRÉNDEME
    ========================================= */

    navSorprendeme.addEventListener(
        "click",
        function() {

            if (!usuarioActual) return;


            if (peliculas.length === 0) {

                alert(
                    "No hay películas disponibles."
                );

                return;

            }


            const random =
                peliculas[
                    Math.floor(
                        Math.random() *
                        peliculas.length
                    )
                ];


            alert(
                "🎲 Te recomendamos: " +
                random.titulo
            );

        }
    );


    /* =========================================
       BUSCADOR
    ========================================= */

    buscadorGlobal.addEventListener(
        "input",
        function() {

            if (!usuarioActual) return;


            const filtro =
                buscadorGlobal.value
                    .trim()
                    .toLowerCase();


            renderPeliculas(filtro);

        }
    );


    /* =========================================
       LOGO → INICIO
    ========================================= */

    logoInicio.addEventListener(
        "click",
        function() {

            if (usuarioActual) {

                mostrarPantalla(
                    "pantallaApp"
                );

            } else {

                mostrarPantalla(
                    "pantallaInicio"
                );

            }

        }
    );


    /* =========================================
       ADMIN
    ========================================= */

    btnAdmin.addEventListener(
        "click",
        function() {

            mostrarPantalla(
                "pantallaAdmin"
            );

        }
    );


    /* =========================================
       LOGIN ADMIN
    ========================================= */

    btnLoginAdmin.addEventListener(
        "click",
        function() {

            const pass =
                document.getElementById(
                    "adminPass"
                ).value;


            if (pass === ADMIN_PASSWORD) {

                document.getElementById(
                    "adminLogin"
                ).style.display = "none";


                document.getElementById(
                    "adminPanel"
                ).style.display = "block";

            } else {

                alert(
                    "Contraseña incorrecta."
                );

            }

        }
    );


    /* =========================================
       AGREGAR PELÍCULA
    ========================================= */

    btnAgregarPeli.addEventListener(
        "click",
        function() {

            const titulo =
                document.getElementById(
                    "tituloPeli"
                ).value.trim();


            const desc =
                document.getElementById(
                    "descPeli"
                ).value.trim();


            const meta =
                document.getElementById(
                    "metaPeli"
                ).value.trim();


            const youtube =
                document.getElementById(
                    "youtubePeli"
                ).value.trim();


            if (
                !titulo ||
                !desc ||
                !meta ||
                !youtube
            ) {

                alert(
                    "Completa todos los campos."
                );

                return;

            }


            peliculas.push({

                id: Date.now(),

                titulo: titulo,

                descripcion: desc,

                meta: meta,

                youtubeId: youtube

            });


            localStorage.setItem(
                "peliculas_db",
                JSON.stringify(peliculas)
            );


            /*
               Limpiamos los campos.
            */

            document.getElementById(
                "tituloPeli"
            ).value = "";


            document.getElementById(
                "descPeli"
            ).value = "";


            document.getElementById(
                "metaPeli"
            ).value = "";


            document.getElementById(
                "youtubePeli"
            ).value = "";


            alert(
                "✅ Película agregada correctamente."
            );


            /*
               Actualizamos el catálogo.
            */

            renderPeliculas();

        }
    );


    /* =========================================
       RENDERIZAR PELÍCULAS
    ========================================= */

    function renderPeliculas(
        filtro = ""
    ) {

        peliculasContainer.innerHTML = "";


        /*
           Filtramos películas.
        */

        const lista =
            peliculas.filter(
                function(p) {

                    const t =
                        (p.titulo || "")
                            .toLowerCase();


                    const d =
                        (p.descripcion || "")
                            .toLowerCase();


                    const m =
                        (p.meta || "")
                            .toLowerCase();


                    return (
                        t.includes(filtro) ||
                        d.includes(filtro) ||
                        m.includes(filtro)
                    );

                }
            );


        /*
           Si no hay resultados.
        */

        if (lista.length === 0) {

            const mensaje =
                document.createElement(
                    "div"
                );

            mensaje.className =
                "sin-resultados";

            mensaje.textContent =
                "🔎 No encontramos películas con esa búsqueda.";

            peliculasContainer.appendChild(
                mensaje
            );

            return;
        }


        /*
           Creamos cada película.
        */

        lista.forEach(
            function(p) {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "pelicula-card";


                /* POSTER */

                const poster =
                    document.createElement(
                        "div"
                    );

                poster.className =
                    "pelicula-poster";

                poster.textContent =
                    "🎬";


                /* TÍTULO */

                const titulo =
                    document.createElement(
                        "div"
                    );

                titulo.className =
                    "pelicula-titulo";


                /*
                   CORREGIDO:
                   Antes tenías p.ttitulo.
                   Ahora usamos p.titulo.
                */

                titulo.textContent =
                    p.titulo;


                /* META */

                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "pelicula-meta";

                meta.textContent =
                    p.meta;


                /* DESCRIPCIÓN */

                const desc =
                    document.createElement(
                        "div"
                    );

                desc.className =
                    "pelicula-desc";

                desc.textContent =
                    p.descripcion;


                /* YOUTUBE */

                const iframe =
                    document.createElement(
                        "iframe"
                    );


                /*
                   Si tenemos un ID válido,
                   mostramos el reproductor.
                */

                if (
                    p.youtubeId &&
                    p.youtubeId !== "VIDEO_ID_1"
                ) {

                    iframe.src =
                        "https://www.youtube.com/embed/" +
                        encodeURIComponent(
                            p.youtubeId
                        );

                    iframe.title =
                        p.titulo;

                    iframe.allow =
                        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

                    iframe.allowFullscreen = true;

                } else {

                    /*
                       Si todavía no hay vídeo,
                       mostramos un mensaje.
                    */

                    iframe.style.display =
                        "none";

                }


                /*
                   Construimos la tarjeta.
                */

                card.appendChild(
                    poster
                );

                card.appendChild(
                    titulo
                );

                card.appendChild(
                    meta
                );

                card.appendChild(
                    desc
                );


                if (
                    p.youtubeId &&
                    p.youtubeId !== "VIDEO_ID_1"
                ) {

                    card.appendChild(
                        iframe
                    );

                }


                peliculasContainer.appendChild(
                    card
                );

            }
        );

    }


    /* =========================================
       INICIALIZAR LA PÁGINA
    ========================================= */

    function iniciarPagina() {

        actualizarMenu();


        /*
           Si ya existe un usuario guardado,
           entramos directamente al catálogo.
        */

        if (usuarioActual) {

            nombreMostrado.textContent =
                usuarioActual;

            mostrarPantalla(
                "pantallaApp"
            );

            renderPeliculas();

        } else {

            mostrarPantalla(
                "pantallaInicio"
            );

        }

    }


    /*
       Iniciamos.
    */

    iniciarPagina();

</script>
