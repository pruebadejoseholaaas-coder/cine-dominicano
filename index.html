<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cine Dominicano</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rojo-rd: #E50914;
            --azul-rd: #002D62;
            --blanco-rd: #FFFFFF;
            --fondo-oscuro: #050814;
            --gris-claro: #CCCCCC;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #0b1630 0, #050814 45%, #000000 100%);
            color: var(--blanco-rd);
        }

        a { color: inherit; text-decoration: none; }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(5, 8, 20, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo-flag {
            width: 26px;
            height: 18px;
            border-radius: 3px;
            overflow: hidden;
            display: flex;
        }

        .flag-band { flex: 1; }
        .blue { background: var(--azul-rd); }
        .white { background: var(--blanco-rd); }
        .red { background: var(--rojo-rd); }

        .logo-text-main { font-size: 18px; }
        .logo-text-sub { font-size: 11px; color: var(--gris-claro); }

        nav {
            display: flex;
            gap: 15px;
            font-size: 13px;
        }

        nav span {
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 999px;
        }

        nav span:hover {
            background: rgba(255,255,255,0.08);
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.06);
            padding: 4px 8px;
            border-radius: 999px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--blanco-rd);
            font-size: 12px;
            width: 140px;
        }

        /* PANTALLAS */
        .pantalla {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 15px 40px;
        }

        .visible { display: block; }

        /* PANTALLA INICIO */
        #pantallaInicio {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
        }

        .inicio-form {
            background: linear-gradient(135deg, rgba(0,45,98,0.9), rgba(229,9,20,0.9));
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        .inicio-form h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .inicio-form p {
            font-size: 12px;
            color: #f5f5f5;
            margin-bottom: 12px;
        }

        .inicio-form input {
            width: 100%;
            padding: 10px;
            border-radius: 999px;
            border: none;
            outline: none;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .btn {
            border: none;
            cursor: pointer;
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--rojo-rd);
            color: var(--blanco-rd);
            width: 100%;
        }

        .btn-primary:hover { background: #ff1b24; }

        /* PANTALLA APP */
        #pantallaApp {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .usuario-info {
            font-size: 12px;
            color: var(--gris-claro);
            margin-bottom: 10px;
        }

        .seccion-titulo {
            font-size: 18px;
            margin-bottom: 8px;
            text-align: center;
        }

        .peliculas-container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 10px;
        }

        .pelicula-card {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pelicula-poster {
            width: 100%;
            height: 140px;
            border-radius: 10px;
            background: linear-gradient(135deg, #1b2a4a, #e50914);
        }

        iframe {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            border: none;
        }

        /* ADMIN */
        .admin-btn {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: rgba(0,45,98,0.9);
            color: var(--blanco-rd);
            border-radius: 999px;
            border: none;
            padding: 8px 14px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        #pantallaAdmin {
            display: none;
        }

        .admin-contenido {
            max-width: 420px;
            margin: 40px auto;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .admin-contenido input {
            width: 100%;
            padding: 9px;
            border-radius: 999px;
            border: none;
            outline: none;
            font-size: 12px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo">
            <div class="logo-flag">
                <div class="flag-band blue"></div>
                <div class="flag-band white"></div>
                <div class="flag-band red"></div>
            </div>
            <div>
                <div class="logo-text-main">Cine Dominicano</div>
                <div class="logo-text-sub">Cine de República Dominicana</div>
            </div>
        </div>

        <nav>
            <span id="navInicio">Inicio</span>
            <span id="navPeliculas">Películas</span>
            <span id="navSorprendeme">🎲 Sorpréndeme</span>
        </nav>

        <div class="search-box">
            <span>🔎</span>
            <input type="text" id="buscadorGlobal" placeholder="Buscar...">
        </div>
    </div>
</header>

<!-- PANTALLA INICIO -->
<div id="pantallaInicio" class="pantalla visible">
    <div class="inicio-form">
        <h2>Bienvenido a Cine Dominicano</h2>
        <p>Escribe tu nombre para entrar y ver el catálogo.</p>
        <input type="text" id="nombreUsuario" placeholder="Tu nombre">
        <button class="btn btn-primary" id="btnEntrar">Entrar</button>
    </div>
</div>

<!-- PANTALLA APP -->
<div id="pantallaApp" class="pantalla">
    <div class="usuario-info">
        Usuario: <span id="nombreMostrado"></span>
    </div>

    <div class="seccion-titulo">Catálogo de Películas Dominicanas</div>

    <div class="peliculas-container" id="peliculasContainer"></div>
</div>

<!-- PANTALLA ADMIN -->
<div id="pantallaAdmin" class="pantalla">
    <div class="admin-contenido">
        <h2>Panel de Administración</h2>

        <div id="adminLogin">
            <input type="password" id="adminPass" placeholder="Contraseña">
            <button class="btn btn-primary" id="btnLoginAdmin">Entrar</button>
        </div>

        <div id="adminPanel" style="display:none;">
            <input type="text" id="tituloPeli" placeholder="Título">
            <input type="text" id="descPeli" placeholder="Descripción">
            <input type="text" id="metaPeli" placeholder="Año · Género · País">
            <input type="text" id="youtubePeli" placeholder="ID de YouTube">
            <button class="btn btn-primary" id="btnAgregarPeli">Agregar Película</button>
        </div>
    </div>
</div>

<button class="admin-btn" id="btnAdmin">⚙ Admin</button>

<script>
    const ADMIN_PASSWORD = "dominicana123";

    let peliculas = JSON.parse(localStorage.getItem("peliculas_db")) || [
        {
            id: 1,
            titulo: "Qué León",
            descripcion: "Comedia romántica dominicana.",
            meta: "2018 · Comedia · República Dominicana",
            youtubeId: "VIDEO_ID_1"
        }
    ];

    let comentarios = JSON.parse(localStorage.getItem("comentarios_db")) || {};

    const pantallaInicio = document.getElementById("pantallaInicio");
    const pantallaApp = document.getElementById("pantallaApp");
    const pantallaAdmin = document.getElementById("pantallaAdmin");

    const nombreUsuarioInput = document.getElementById("nombreUsuario");
    const nombreMostrado = document.getElementById("nombreMostrado");
    const peliculasContainer = document.getElementById("peliculasContainer");

    const btnEntrar = document.getElementById("btnEntrar");
    const btnAdmin = document.getElementById("btnAdmin");
    const btnLoginAdmin = document.getElementById("btnLoginAdmin");
    const btnAgregarPeli = document.getElementById("btnAgregarPeli");

    const navInicio = document.getElementById("navInicio");
    const navPeliculas = document.getElementById("navPeliculas");
    const navSorprendeme = document.getElementById("navSorprendeme");
    const buscadorGlobal = document.getElementById("buscadorGlobal");

    let usuarioActual = "";

    function mostrarPantalla(id) {
        pantallaInicio.classList.remove("visible");
        pantallaApp.classList.remove("visible");
        pantallaAdmin.classList.remove("visible");

        if (!usuarioActual && id !== "pantallaInicio") {
            pantallaInicio.classList.add("visible");
            return;
        }

        document.getElementById(id).classList.add("visible");
    }

    function actualizarMenu() {
        const protegido = [navPeliculas, navSorprendeme];
        protegido.forEach(item => {
            item.style.opacity = usuarioActual ? "1" : "0.3";
            item.style.pointerEvents = usuarioActual ? "auto" : "none";
        });
    }

    btnEntrar.addEventListener("click", () => {
        const nombre = nombreUsuarioInput.value.trim();
        if (!nombre) {
            alert("Escribe tu nombre para entrar.");
            return;
        }
        usuarioActual = nombre;
        nombreMostrado.textContent = usuarioActual;

        actualizarMenu();
        mostrarPantalla("pantallaApp");
        renderPeliculas();
    });

    navInicio.addEventListener("click", () => mostrarPantalla("pantallaInicio"));
    navPeliculas.addEventListener("click", () => mostrarPantalla("pantallaApp"));

    navSorprendeme.addEventListener("click", () => {
        if (!usuarioActual) return;
        const random = peliculas[Math.floor(Math.random() * peliculas.length)];
        alert("🎲 Te recomendamos: " + random.titulo);
    });

    buscadorGlobal.addEventListener("input", () => {
        if (!usuarioActual) return;
        renderPeliculas(buscadorGlobal.value.trim().toLowerCase());
    });

    btnAdmin.addEventListener("click", () => mostrarPantalla("pantallaAdmin"));

    btnLoginAdmin.addEventListener("click", () => {
        const pass = document.getElementById("adminPass").value;
        if (pass === ADMIN_PASSWORD) {
            document.getElementById("adminLogin").style.display = "none";
            document.getElementById("adminPanel").style.display = "block";
        } else {
            alert("Contraseña incorrecta.");
        }
    });

    btnAgregarPeli.addEventListener("click", () => {
        const titulo = document.getElementById("tituloPeli").value.trim();
        const desc = document.getElementById("descPeli").value.trim();
        const meta = document.getElementById("metaPeli").value.trim();
        const youtube = document.getElementById("youtubePeli").value.trim();

        if (!titulo || !desc || !meta || !youtube) {
            alert("Completa todos los campos.");
            return;
        }

        peliculas.push({
            id: Date.now(),
            titulo,
            descripcion: desc,
            meta,
            youtubeId: youtube
        });

        localStorage.setItem("peliculas_db", JSON.stringify(peliculas));
        alert("Película agregada.");
    });

    function renderPeliculas(filtro = "") {
        peliculasContainer.innerHTML = "";

        const lista = peliculas.filter(p => {
            const t = p.titulo.toLowerCase();
            const d = p.descripcion.toLowerCase();
            const m = p.meta.toLowerCase();
            return t.includes(filtro) || d.includes(filtro) || m.includes(filtro);
        });

        lista.forEach(p => {
            const card = document.createElement("div");
            card.className = "pelicula-card";

            const poster = document.createElement("div");
            poster.className = "pelicula-poster";

            const titulo = document.createElement("div");
            titulo.textContent = p.titulo;

            const meta = document.createElement("div");
            meta.textContent = p.meta;

            const desc = document.createElement("div");
            desc.style.fontSize = "11px";
            desc.style.color = "#CCCCCC";
            desc.textContent = p.descripcion;

            const iframe = document.createElement("iframe");
            iframe.src = `https://www.youtube.com/embed/${p.youtubeId}`;

            card.appendChild(poster);
            card.appendChild(titulo);
            card.appendChild(meta);
            card.appendChild(desc);
            card.appendChild(iframe);

            peliculasContainer.appendChild(card);
        });
    }
</script>

</body>
</html>
