<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Películas Dominicanas Gratis</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        .pantalla-inicio, .pantalla-app {
            display: none;
            padding: 20px;
        }

        .visible {
            display: block;
        }

        h1, h2 {
            text-align: center;
        }

        .inicio-contenido {
            max-width: 400px;
            margin: 80px auto;
            text-align: center;
            background: #222;
            padding: 20px;
            border-radius: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #e50914;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #f6121d;
        }

        .peliculas-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .pelicula-card {
            background: #222;
            width: 320px;
            padding: 10px;
            border-radius: 10px;
        }

        .pelicula-card h3 {
            margin: 10px 0;
        }

        iframe {
            width: 100%;
            height: 180px;
            border-radius: 10px;
        }

        .comentarios {
            margin-top: 10px;
        }

        .comentarios h4 {
            margin-bottom: 5px;
        }

        .comentarios-lista {
            max-height: 120px;
            overflow-y: auto;
            background: #111;
            padding: 5px;
            border-radius: 5px;
            font-size: 14px;
        }

        .comentario-item {
            border-bottom: 1px solid #333;
            padding: 4px 0;
        }

        .comentario-item:last-child {
            border-bottom: none;
        }

        .comentarios input[type="text"] {
            width: calc(100% - 20px);
            margin-top: 5px;
        }

        .usuario-info {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

<div id="pantallaInicio" class="pantalla-inicio visible">
    <div class="inicio-contenido">
        <h1>Películas Dominicanas Gratis</h1>
        <p>Escribe tu nombre para entrar y comentar las películas.</p>
        <input type="text" id="nombreUsuario" placeholder="Tu nombre">
        <button id="btnEntrar">Entrar</button>
    </div>
</div>

<div id="pantallaApp" class="pantalla-app">
    <h2>Catálogo de Películas Dominicanas</h2>
    <div class="usuario-info">
        Usuario: <span id="nombreMostrado"></span>
    </div>
    <div class="peliculas-container" id="peliculasContainer">
        <!-- Aquí se generan las películas automáticamente -->
    </div>
</div>

<script>
    // Lista de películas (puedes agregar más sin tocar el HTML)
    const peliculas = [
        {
            id: 1,
            titulo: "Película Dominicana 1",
            descripcion: "Descripción breve de la película 1.",
            youtubeId: "VIDEO_ID_1" // reemplaza con el ID real de YouTube
        },
        {
            id: 2,
            titulo: "Película Dominicana 2",
            descripcion: "Descripción breve de la película 2.",
            youtubeId: "VIDEO_ID_2"
        }
        // Agrega más objetos aquí para más películas
    ];

    // Comentarios guardados en localStorage
    const COMENTARIOS_KEY = "comentarios_peliculas";

    function cargarComentarios() {
        const datos = localStorage.getItem(COMENTARIOS_KEY);
        return datos ? JSON.parse(datos) : {};
    }

    function guardarComentarios(comentarios) {
        localStorage.setItem(COMENTARIOS_KEY, JSON.stringify(comentarios));
    }

    let comentarios = cargarComentarios();
    let usuarioActual = "";

    const pantallaInicio = document.getElementById("pantallaInicio");
    const pantallaApp = document.getElementById("pantallaApp");
    const btnEntrar = document.getElementById("btnEntrar");
    const nombreUsuarioInput = document.getElementById("nombreUsuario");
    const nombreMostrado = document.getElementById("nombreMostrado");
    const peliculasContainer = document.getElementById("peliculasContainer");

    btnEntrar.addEventListener("click", () => {
        const nombre = nombreUsuarioInput.value.trim();
        if (!nombre) {
            alert("Por favor, escribe tu nombre para entrar.");
            return;
        }
        usuarioActual = nombre;
        nombreMostrado.textContent = usuarioActual;
        pantallaInicio.classList.remove("visible");
        pantallaApp.classList.add("visible");
        renderPeliculas();
    });

    function renderPeliculas() {
        peliculasContainer.innerHTML = "";
        peliculas.forEach(pelicula => {
            const card = document.createElement("div");
            card.className = "pelicula-card";

            const titulo = document.createElement("h3");
            titulo.textContent = pelicula.titulo;

            const descripcion = document.createElement("p");
            descripcion.textContent = pelicula.descripcion;

            const iframe = document.createElement("iframe");
            iframe.src = `https://www.youtube.com/embed/${pelicula.youtubeId}`;
            iframe.setAttribute("frameborder", "0");
            iframe.setAttribute("allowfullscreen", "true");

            const comentariosDiv = document.createElement("div");
            comentariosDiv.className = "comentarios";

            const comentariosTitulo = document.createElement("h4");
            comentariosTitulo.textContent = "Comentarios";

            const comentariosLista = document.createElement("div");
            comentariosLista.className = "comentarios-lista";

            const inputComentario = document.createElement("input");
            inputComentario.type = "text";
            inputComentario.placeholder = "Escribe un comentario...";

            const btnComentar = document.createElement("button");
            btnComentar.textContent = "Comentar";

            btnComentar.addEventListener("click", () => {
                const texto = inputComentario.value.trim();
                if (!texto) return;
                const nuevoComentario = {
                    usuario: usuarioActual,
                    texto,
                    fecha: new Date().toLocaleString()
                };
                if (!comentarios[pelicula.id]) {
                    comentarios[pelicula.id] = [];
                }
                comentarios[pelicula.id].push(nuevoComentario);
                guardarComentarios(comentarios);
                inputComentario.value = "";
                mostrarComentarios(pelicula.id, comentariosLista);
            });

            comentariosDiv.appendChild(comentariosTitulo);
            comentariosDiv.appendChild(comentariosLista);
            comentariosDiv.appendChild(inputComentario);
            comentariosDiv.appendChild(btnComentar);

            card.appendChild(titulo);
            card.appendChild(descripcion);
            card.appendChild(iframe);
            card.appendChild(comentariosDiv);

            peliculasContainer.appendChild(card);

            mostrarComentarios(pelicula.id, comentariosLista);
        });
    }

    function mostrarComentarios(peliculaId, contenedor) {
        contenedor.innerHTML = "";
        const lista = comentarios[peliculaId] || [];
        lista.forEach(c => {
            const item = document.createElement("div");
            item.className = "comentario-item";
            item.textContent = `${c.usuario}: ${c.texto} (${c.fecha})`;
            contenedor.appendChild(item);
        });
    }
</script>

</body>
</html>
